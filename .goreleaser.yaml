version: 2

builds:
  - main: ./cmd/meta-keyguard
    binary: meta-keyguard
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/omenking/meta-keyguard/internal/keyguard.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "meta-keyguard_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
