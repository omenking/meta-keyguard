[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-keyguard"
version = "0.1.0"
description = "Short-lived, centrally stored Meta Model API keys, managed through a Chrome extension"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keyguard = "meta_keyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
